name: DevSecOps Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ------- Etape 1 : build de base (backend uniquement) -------
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install backend dependencies only
        run: npm install --ignore-scripts --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000

      - name: Build backend
        run: npm run build:server

  # ------- SAST : analyse du code source -------
  sast:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep

    steps:
      - uses: actions/checkout@v4

      - name: Semgrep report
        run: semgrep scan --config=p/owasp-top-ten --json --output=semgrep-report.json
        continue-on-error: true

      - name: Upload Semgrep report
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-report.json

      - name: Semgrep security gate
        run: semgrep scan --config=p/owasp-top-ten --error

  # ------- Scan de secrets -------
  secrets_scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz gitleaks

      - name: Gitleaks scan (filesystem complet)
        run: ./gitleaks detect --no-git --source . --exit-code 1

  # ------- SCA : dependances vulnerables -------
  scan_dependencies:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan - report
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          severity: "CRITICAL,HIGH"
          format: "json"
          output: "trivy-fs-report.json"

      - name: Upload Trivy fs report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-report
          path: trivy-fs-report.json

      - name: Trivy filesystem security gate
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          severity: "CRITICAL,HIGH"
          exit-code: "1"

  # ------- Scan de l'image Docker -------
  docker_scan:
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f .github/Dockerfile.devsecops -t juice-shop:ci .

      - name: Trivy Docker image scan - report
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "juice-shop:ci"
          severity: "CRITICAL,HIGH"
          format: "json"
          output: "trivy-docker-report.json"

      - name: Upload Trivy Docker report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-docker-report
          path: "trivy-docker-report.json"

      - name: Trivy Docker image security gate
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "juice-shop:ci"
          severity: "CRITICAL,HIGH"
          exit-code: "1"

  # ------- Scan IaC : Terraform -------
  scan_iac:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Checkov IaC scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform
          soft_fail: true

  # ------- Génération SBOM -------
  generate_sbom:
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - uses: actions/checkout@v4

      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Generate SBOM
        run: syft . -o cyclonedx-json=sbom.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

  # ------- DAST : analyse dynamique de l'application -------
  dast:
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - uses: actions/checkout@v4

      # ----------------------------------------------------
      # BUILD APPLICATION IMAGE
      # ----------------------------------------------------
      - name: Build Docker image
        run: docker build -f .github/Dockerfile.devsecops -t juice-shop:dast .

      # ----------------------------------------------------
      # START APPLICATION
      # ----------------------------------------------------
      - name: Start Juice Shop
        run: docker run -d --name juice-shop -p 3000:3000 juice-shop:dast

      # ----------------------------------------------------
      # WAIT FOR APPLICATION
      # ----------------------------------------------------
      - name: Wait for app
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000 > /dev/null; then
              echo "Juice Shop is ready"
              exit 0
            fi

            echo "Waiting for Juice Shop..."
            sleep 5
          done

          echo "Juice Shop did not become ready"
          docker ps -a
          docker logs juice-shop
          exit 1

      # ----------------------------------------------------
      # OWASP ZAP DAST SCAN
      # ----------------------------------------------------
      - name: OWASP ZAP Baseline Scan
        continue-on-error: true
        run: |
          docker run --rm \
            --user 0 \
            --network host \
            -v "${GITHUB_WORKSPACE}:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://127.0.0.1:3000 \
            -J report_json.json \
            -w report_md.md \
            -r report_html.html \
            -a
      # ----------------------------------------------------
      # UPLOAD ZAP REPORTS
      # ----------------------------------------------------
      # ----------------------------------------------------
      # UPLOAD ZAP REPORTS
      # ----------------------------------------------------
      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: |
            report_html.html
            report_json.json
            report_md.md
          if-no-files-found: error
          retention-days: 30

      # ----------------------------------------------------
      # DAST SECURITY GATE
      # HIGH / MEDIUM = BLOCK PIPELINE
      # ----------------------------------------------------
      - name: DAST Security Gate
        if: always()
        run: |
          echo "=========================================="
          echo "        OWASP ZAP SECURITY GATE"
          echo "=========================================="

          if [ ! -f report_json.json ]; then
            echo "❌ ZAP JSON report was not generated."
            exit 1
          fi

          HIGH=$(jq '[.site[]?.alerts[]? | select(.riskcode == "3" or .riskcode == 3)] | length' report_json.json)
          MEDIUM=$(jq '[.site[]?.alerts[]? | select(.riskcode == "2" or .riskcode == 2)] | length' report_json.json)
          LOW=$(jq '[.site[]?.alerts[]? | select(.riskcode == "1" or .riskcode == 1)] | length' report_json.json)
          INFO=$(jq '[.site[]?.alerts[]? | select(.riskcode == "0" or .riskcode == 0)] | length' report_json.json)

          echo ""
          echo "High vulnerabilities   : $HIGH"
          echo "Medium vulnerabilities : $MEDIUM"
          echo "Low vulnerabilities    : $LOW"
          echo "Informational          : $INFO"
          echo ""

          if [ "$HIGH" -gt 0 ] || [ "$MEDIUM" -gt 0 ]; then
            echo "❌ DAST SECURITY GATE FAILED"
            echo "High/Medium vulnerabilities detected."
            echo "Pipeline is BLOCKED."
            exit 1
          fi

          echo "✅ DAST SECURITY GATE PASSED"
          echo "No High or Medium vulnerabilities detected."

      # ----------------------------------------------------
      # STOP APPLICATION
      # ----------------------------------------------------
      - name: Stop container
        if: always()
        run: |
          docker stop juice-shop || true
          docker rm juice-shop || true

  # ============================================================
  #              DISCORD SECURITY NOTIFICATION
  # ============================================================
  notify:
    name: Discord Security Notification
    runs-on: ubuntu-latest

    needs:
      - build
      - sast
      - secrets_scan
      - scan_dependencies
      - docker_scan
      - dast

    if: always()

    steps:
      # -------- DETECT FAILED CONTROLS --------
      - name: Detect pipeline status
        id: status
        shell: bash
        run: |
          FAILED_CONTROLS=""

          if [ "${{ needs.build.result }}" = "failure" ]; then
            FAILED_CONTROLS="${FAILED_CONTROLS}• 🏗️ Build — Backend Build\n"
          fi

          if [ "${{ needs.sast.result }}" = "failure" ]; then
            FAILED_CONTROLS="${FAILED_CONTROLS}• 🧠 SAST — Semgrep\n"
          fi

          if [ "${{ needs.secrets_scan.result }}" = "failure" ]; then
            FAILED_CONTROLS="${FAILED_CONTROLS}• 🔑 Secret Scanning — Gitleaks\n"
          fi

          if [ "${{ needs.scan_dependencies.result }}" = "failure" ]; then
            FAILED_CONTROLS="${FAILED_CONTROLS}• 📦 SCA — Trivy FS\n"
          fi

          if [ "${{ needs.docker_scan.result }}" = "failure" ]; then
            FAILED_CONTROLS="${FAILED_CONTROLS}• 🐳 Container Scanning — Trivy\n"
          fi

          if [ "${{ needs.dast.result }}" = "failure" ]; then
            FAILED_CONTROLS="${FAILED_CONTROLS}• 🌐 DAST — OWASP ZAP\n"
          fi

          {
            echo "failed_controls<<EOF"
            printf "%b" "$FAILED_CONTROLS"
            echo
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # -------- FAILED --------
      - name: Notify Discord on failure
        if: |
          contains(needs.*.result, 'failure')
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          MESSAGE=$(cat <<EOF
          🛡️ **DEVSECOPS SECURITY ALERT**

          ━━━━━━━━━━━━━━━━━━━━

          🔴 **PIPELINE BLOCKED**

          A security gate has detected an issue that requires attention.

          📦 **Repository**
          \`${{ github.repository }}\`

          🌿 **Branch**
          \`${{ github.ref_name }}\`

          👤 **Triggered by**
          \`${{ github.actor }}\`

          🔖 **Commit**
          \`${{ github.sha }}\`

          ━━━━━━━━━━━━━━━━━━━━

          ⚠️ **Failed Security Controls**

          ${{ steps.status.outputs.failed_controls }}

          ━━━━━━━━━━━━━━━━━━━━

          🔧 **Action required**

          Review the failed security control(s) and remediate the detected issue before the pipeline can be validated.

          🔗 **View Pipeline Run**
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          ━━━━━━━━━━━━━━━━━━━━
          🛡️ DevSecOps • Automated Security Validation
          EOF
          )

          PAYLOAD=$(jq -n --arg content "$MESSAGE" '{content: $content}')

          curl -fsS \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK_URL"

      # -------- SUCCESS --------
      - name: Notify Discord on success
        if: |
          !contains(needs.*.result, 'failure') &&
          !contains(needs.*.result, 'cancelled') &&
          !contains(needs.*.result, 'skipped')
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          MESSAGE=$(cat <<EOF
          🛡️ **DEVSECOPS SECURITY REPORT**

          ━━━━━━━━━━━━━━━━━━━━

          🟢 **PIPELINE VALIDATED**

          All blocking security controls have passed successfully.

          📦 **Repository**
          \`${{ github.repository }}\`

          🌿 **Branch**
          \`${{ github.ref_name }}\`

          👤 **Triggered by**
          \`${{ github.actor }}\`

          🔖 **Commit**
          \`${{ github.sha }}\`

          ━━━━━━━━━━━━━━━━━━━━

          ✅ **Security Validation**

          • 🧠 SAST — Semgrep
          • 🔑 Secret Scanning — Gitleaks
          • 📦 SCA — Trivy FS
          • 🐳 Container Scanning — Trivy
          • 🌐 DAST — OWASP ZAP

          📋 SBOM — Syft generated
          🏗️ IaC — Checkov audited

          ━━━━━━━━━━━━━━━━━━━━

          🔗 **View Pipeline Run**
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          ━━━━━━━━━━━━━━━━━━━━
          🛡️ DevSecOps • Automated Security Validation
          EOF
          )

          PAYLOAD=$(jq -n --arg content "$MESSAGE" '{content: $content}')

          curl -fsS \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK_URL"

      # -------- CANCELLED --------
      - name: Notify Discord on cancelled
        if: |
          contains(needs.*.result, 'cancelled')
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          MESSAGE=$(cat <<EOF
          ⚠️ **DEVSECOPS PIPELINE CANCELLED**

          ━━━━━━━━━━━━━━━━━━━━

          🟡 **SECURITY VALIDATION INTERRUPTED**

          The workflow was cancelled before all security controls completed.

          📦 **Repository**
          \`${{ github.repository }}\`

          🌿 **Branch**
          \`${{ github.ref_name }}\`

          👤 **Triggered by**
          \`${{ github.actor }}\`

          🔖 **Commit**
          \`${{ github.sha }}\`

          ━━━━━━━━━━━━━━━━━━━━

          🔗 **View Pipeline Run**
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          ━━━━━━━━━━━━━━━━━━━━
          🛡️ DevSecOps • Automated Security Validation
          EOF
          )

          PAYLOAD=$(jq -n --arg content "$MESSAGE" '{content: $content}')

          curl -fsS \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK_URL"

  # ============================================================
  # ============================================================
  # ============================================================
  #                    SECURITY CONTROL ROOM
  # ============================================================
  summary:
    name: 🛡️ Security Control Room
    runs-on: ubuntu-latest

    needs:
      - build
      - sast
      - secrets_scan
      - scan_dependencies
      - docker_scan
      - scan_iac
      - generate_sbom
      - dast

    if: always()

    steps:
      - name: Generate Security Control Room
        shell: bash
        run: |

          echo "# 🛡️ DEVSECOPS SECURITY CONTROL ROOM" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "> **Continuous Security Validation Dashboard**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "## 📦 Application Context" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "| Property | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Repository | \`${{ github.repository }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Triggered by | \`${{ github.actor }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "## 🔍 Security Pipeline" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          echo " SOURCE CODE" >> "$GITHUB_STEP_SUMMARY"
          echo "      │" >> "$GITHUB_STEP_SUMMARY"
          echo "      ▼" >> "$GITHUB_STEP_SUMMARY"
          echo " ┌───────────────┐" >> "$GITHUB_STEP_SUMMARY"
          echo " │ 🧠 SAST       │  Semgrep" >> "$GITHUB_STEP_SUMMARY"
          echo " └───────┬───────┘" >> "$GITHUB_STEP_SUMMARY"
          echo "         │" >> "$GITHUB_STEP_SUMMARY"
          echo "         ▼" >> "$GITHUB_STEP_SUMMARY"
          echo " ┌───────────────┐" >> "$GITHUB_STEP_SUMMARY"
          echo " │ 🔑 SECRETS    │  Gitleaks" >> "$GITHUB_STEP_SUMMARY"
          echo " └───────┬───────┘" >> "$GITHUB_STEP_SUMMARY"
          echo "         │" >> "$GITHUB_STEP_SUMMARY"
          echo "         ▼" >> "$GITHUB_STEP_SUMMARY"
          echo " ┌───────────────┐" >> "$GITHUB_STEP_SUMMARY"
          echo " │ 📦 SCA        │  Trivy FS" >> "$GITHUB_STEP_SUMMARY"
          echo " └───────┬───────┘" >> "$GITHUB_STEP_SUMMARY"
          echo "         │" >> "$GITHUB_STEP_SUMMARY"
          echo "         ▼" >> "$GITHUB_STEP_SUMMARY"
          echo " ┌───────────────┐" >> "$GITHUB_STEP_SUMMARY"
          echo " │ 🐳 CONTAINER  │  Trivy" >> "$GITHUB_STEP_SUMMARY"
          echo " └───────┬───────┘" >> "$GITHUB_STEP_SUMMARY"
          echo "         │" >> "$GITHUB_STEP_SUMMARY"
          echo "         ▼" >> "$GITHUB_STEP_SUMMARY"
          echo " ┌───────────────┐" >> "$GITHUB_STEP_SUMMARY"
          echo " │ 🏗️  IaC       │  Checkov" >> "$GITHUB_STEP_SUMMARY"
          echo " └───────┬───────┘" >> "$GITHUB_STEP_SUMMARY"
          echo "         │" >> "$GITHUB_STEP_SUMMARY"
          echo "         ▼" >> "$GITHUB_STEP_SUMMARY"
          echo " ┌───────────────┐" >> "$GITHUB_STEP_SUMMARY"
          echo " │ 📋 SBOM       │  Syft" >> "$GITHUB_STEP_SUMMARY"
          echo " └───────┬───────┘" >> "$GITHUB_STEP_SUMMARY"
          echo "         │" >> "$GITHUB_STEP_SUMMARY"
          echo "         ▼" >> "$GITHUB_STEP_SUMMARY"
          echo " ┌───────────────┐" >> "$GITHUB_STEP_SUMMARY"
          echo " │ 🌐 DAST       │  OWASP ZAP" >> "$GITHUB_STEP_SUMMARY"
          echo " └───────────────┘" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "## 🚦 Security Control Status" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "| Security Layer | Tool | Type | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ needs.build.result }}" = "success" ]; then
            echo "| 🏗️ Build | Node.js | Blocking | 🟢 PASSED |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| 🏗️ Build | Node.js | Blocking | 🔴 ${{ needs.build.result }} |" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${{ needs.sast.result }}" = "success" ]; then
            echo "| 🧠 SAST | Semgrep | Blocking | 🟢 PASSED |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| 🧠 SAST | Semgrep | Blocking | 🔴 ${{ needs.sast.result }} |" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${{ needs.secrets_scan.result }}" = "success" ]; then
            echo "| 🔑 Secrets | Gitleaks | Blocking | 🟢 PASSED |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| 🔑 Secrets | Gitleaks | Blocking | 🔴 ${{ needs.secrets_scan.result }} |" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${{ needs.scan_dependencies.result }}" = "success" ]; then
            echo "| 📦 SCA | Trivy FS | Blocking | 🟢 PASSED |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| 📦 SCA | Trivy FS | Blocking | 🔴 ${{ needs.scan_dependencies.result }} |" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${{ needs.docker_scan.result }}" = "success" ]; then
            echo "| 🐳 Container | Trivy | Blocking | 🟢 PASSED |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| 🐳 Container | Trivy | Blocking | 🔴 ${{ needs.docker_scan.result }} |" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${{ needs.scan_iac.result }}" = "success" ]; then
            echo "| 🏗️ IaC | Checkov | Audit | 🟡 REVIEWED |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| 🏗️ IaC | Checkov | Audit | 🔴 ${{ needs.scan_iac.result }} |" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${{ needs.generate_sbom.result }}" = "success" ]; then
            echo "| 📋 SBOM | Syft | Inventory | 🟢 GENERATED |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| 📋 SBOM | Syft | Inventory | 🔴 ${{ needs.generate_sbom.result }} |" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${{ needs.dast.result }}" = "success" ]; then
            echo "| 🌐 DAST | OWASP ZAP | Blocking | 🟢 PASSED |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| 🌐 DAST | OWASP ZAP | Blocking | 🔴 ${{ needs.dast.result }} |" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "## 🚦 Security Gates" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "| Gate | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ needs.sast.result }}" = "success" ]; then
            echo "| 🧠 SAST | 🟢 OPEN |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| 🧠 SAST | 🔴 BLOCKED |" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${{ needs.secrets_scan.result }}" = "success" ]; then
            echo "| 🔑 Secrets | 🟢 OPEN |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| 🔑 Secrets | 🔴 BLOCKED |" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${{ needs.scan_dependencies.result }}" = "success" ]; then
            echo "| 📦 SCA | 🟢 OPEN |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| 📦 SCA | 🔴 BLOCKED |" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${{ needs.docker_scan.result }}" = "success" ]; then
            echo "| 🐳 Container | 🟢 OPEN |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| 🐳 Container | 🔴 BLOCKED |" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${{ needs.dast.result }}" = "success" ]; then
            echo "| 🌐 DAST | 🟢 OPEN |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| 🌐 DAST | 🔴 BLOCKED |" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ needs.build.result }}" = "success" ] && \
             [ "${{ needs.sast.result }}" = "success" ] && \
             [ "${{ needs.secrets_scan.result }}" = "success" ] && \
             [ "${{ needs.scan_dependencies.result }}" = "success" ] && \
             [ "${{ needs.docker_scan.result }}" = "success" ] && \
             [ "${{ needs.dast.result }}" = "success" ]; then

            echo "## 🟢 FINAL DECISION" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### 🛡️ PIPELINE VALIDATED" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "All blocking security gates have passed successfully." >> "$GITHUB_STEP_SUMMARY"

          else

            echo "## 🔴 FINAL DECISION" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### 🚨 PIPELINE BLOCKED" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "At least one blocking security gate requires attention before validation." >> "$GITHUB_STEP_SUMMARY"

          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "---" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "📎 **Security reports and SBOM are available in the workflow artifacts.**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "📢 **Discord notification:** enabled" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "🛡️ *DevSecOps • Automated Security Validation*" >> "$GITHUB_STEP_SUMMARY"
  # ============================================================
  # SECURITY DASHBOARD
  # ============================================================
  dashboard:
    name: 🛡️ Generate Security Dashboard
    runs-on: ubuntu-latest
    if: always()

    needs:
      - build
      - sast
      - secrets_scan
      - scan_dependencies
      - docker_scan
      - scan_iac
      - generate_sbom
      - dast

    steps:
      - name: Generate Cybersecurity Dashboard
        shell: bash
        run: |
          mkdir -p dashboard

          BUILD="${{ needs.build.result }}"
          SAST="${{ needs.sast.result }}"
          SECRETS="${{ needs.secrets_scan.result }}"
          SCA="${{ needs.scan_dependencies.result }}"
          CONTAINER="${{ needs.docker_scan.result }}"
          IAC="${{ needs.scan_iac.result }}"
          SBOM="${{ needs.generate_sbom.result }}"
          DAST="${{ needs.dast.result }}"
                # ============================================================
          # DYNAMIC SECURITY METRICS
          # ============================================================

          status_label() {
            case "$1" in
              success)
                echo "PASSED"
                ;;
              failure)
                echo "FAILED"
                ;;
              cancelled)
                echo "CANCELLED"
                ;;
              skipped)
                echo "SKIPPED"
                ;;
              *)
                echo "REVIEW"
                ;;
            esac
          }

          status_class() {
            case "$1" in
              success)
                echo "badge-success"
                ;;
              failure|cancelled)
                echo "badge-danger"
                ;;
              *)
                echo "badge-warning"
                ;;
            esac
          }

          BUILD_LABEL="$(status_label "$BUILD")"
          SAST_LABEL="$(status_label "$SAST")"
          SECRETS_LABEL="$(status_label "$SECRETS")"
          SCA_LABEL="$(status_label "$SCA")"
          CONTAINER_LABEL="$(status_label "$CONTAINER")"
          IAC_LABEL="$(status_label "$IAC")"
          SBOM_LABEL="$(status_label "$SBOM")"
          DAST_LABEL="$(status_label "$DAST")"

          BUILD_CLASS="$(status_class "$BUILD")"
          SAST_CLASS="$(status_class "$SAST")"
          SECRETS_CLASS="$(status_class "$SECRETS")"
          SCA_CLASS="$(status_class "$SCA")"
          CONTAINER_CLASS="$(status_class "$CONTAINER")"
          IAC_CLASS="$(status_class "$IAC")"
          SBOM_CLASS="$(status_class "$SBOM")"
          DAST_CLASS="$(status_class "$DAST")"

          # Blocking controls
          BLOCKING_TOTAL=6
          BLOCKING_PASSED=0

          for result in "$BUILD" "$SAST" "$SECRETS" "$SCA" "$CONTAINER" "$DAST"; do
            if [[ "$result" == "success" ]]; then
              BLOCKING_PASSED=$((BLOCKING_PASSED + 1))
            fi
          done

          # Weighted Security Control Score
          SCORE=0

          [[ "$BUILD" == "success" ]] && SCORE=$((SCORE + 10))
          [[ "$SAST" == "success" ]] && SCORE=$((SCORE + 15))
          [[ "$SECRETS" == "success" ]] && SCORE=$((SCORE + 15))
          [[ "$SCA" == "success" ]] && SCORE=$((SCORE + 15))
          [[ "$CONTAINER" == "success" ]] && SCORE=$((SCORE + 15))
          [[ "$DAST" == "success" ]] && SCORE=$((SCORE + 15))
          [[ "$IAC" == "success" ]] && SCORE=$((SCORE + 10))
          [[ "$SBOM" == "success" ]] && SCORE=$((SCORE + 5))

          # Final security decision
          if [[ "$BUILD" == "success" &&
                "$SAST" == "success" &&
                "$SECRETS" == "success" &&
                "$SCA" == "success" &&
                "$CONTAINER" == "success" &&
                "$DAST" == "success" ]]; then

            FINAL_ICON="🟢"
            FINAL_TITLE="PIPELINE SECURE"
            FINAL_CLASS="success"
            FINAL_MESSAGE="All critical security gates passed successfully."

          else

            FINAL_ICON="🔴"
            FINAL_TITLE="PIPELINE BLOCKED"
            FINAL_CLASS="danger"
            FINAL_MESSAGE="One or more blocking security controls require attention."

          fi

          RUN_TIME="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          SHORT_SHA="${GITHUB_SHA:0:7}"

          cat > dashboard/security-dashboard.html <<EOF
