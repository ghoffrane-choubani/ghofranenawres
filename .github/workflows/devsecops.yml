name: DevSecOps Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ------- Etape 1 : build de base (backend uniquement) -------
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install backend dependencies only
        run: npm install --ignore-scripts --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000

      - name: Build backend
        run: npm run build:server
  # ------- SAST : analyse du code source -------
  sast:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep

    steps:
      - uses: actions/checkout@v4

      - name: Semgrep report
        run: semgrep scan --config=p/owasp-top-ten --json --output=semgrep-report.json
        continue-on-error: true

      - name: Upload Semgrep report
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-report.json

      - name: Semgrep security gate
        run: semgrep scan --config=p/owasp-top-ten --error
  # ------- Scan de secrets -------
  secrets_scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz gitleaks

      - name: Gitleaks scan (filesystem complet)
        run: ./gitleaks detect --no-git --source . --exit-code 1
  # ------- SCA : dependances vulnerables -------
  scan_dependencies:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan - report
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          severity: 'CRITICAL,HIGH'
          format: 'json'
          output: 'trivy-fs-report.json'

      - name: Upload Trivy fs report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-report
          path: trivy-fs-report.json

      - name: Trivy filesystem security gate
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
  # ------- Scan de l'image Docker -------
  docker_scan:
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f .github/Dockerfile.devsecops -t juice-shop:ci .
      - name: Trivy Docker image scan - report
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'juice-shop:ci'
          severity: 'CRITICAL,HIGH'
          format: 'json'
          output: 'trivy-docker-report.json'

      - name: Upload Trivy Docker report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-docker-report
          path: trivy-docker-report.json

      - name: Trivy Docker image security gate
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'juice-shop:ci'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
  # ------- Scan IaC : Terraform -------
  scan_iac:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Checkov IaC scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform
          soft_fail: true
  # ------- Génération SBOM -------
  generate_sbom:
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - uses: actions/checkout@v4

      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Generate SBOM
        run: syft . -o cyclonedx-json=sbom.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json