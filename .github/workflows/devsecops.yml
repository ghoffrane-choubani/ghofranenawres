name: DevSecOps Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:

  # ------- Etape 1 : build de base (backend uniquement) -------
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install backend dependencies only
        run: npm install --ignore-scripts --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000

      - name: Build backend
        run: npm run build:server


  # ------- SAST : analyse du code source -------
  sast:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep

    steps:
      - uses: actions/checkout@v4

      - name: Semgrep report
        run: semgrep scan --config=p/owasp-top-ten --json --output=semgrep-report.json
        continue-on-error: true

      - name: Upload Semgrep report
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-report.json

      - name: Semgrep security gate
        run: semgrep scan --config=p/owasp-top-ten --error


  # ------- Scan de secrets -------
  secrets_scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz gitleaks

      - name: Gitleaks scan (filesystem complet)
        run: ./gitleaks detect --no-git --source . --exit-code 1


  # ------- SCA : dependances vulnerables -------
  scan_dependencies:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan - report
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          severity: 'CRITICAL,HIGH'
          format: 'json'
          output: 'trivy-fs-report.json'

      - name: Upload Trivy fs report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-report
          path: trivy-fs-report.json

      - name: Trivy filesystem security gate
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'


  # ------- Scan de l'image Docker -------
  docker_scan:
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f .github/Dockerfile.devsecops -t juice-shop:ci .

      - name: Trivy Docker image scan - report
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'juice-shop:ci'
          severity: 'CRITICAL,HIGH'
          format: 'json'
          output: 'trivy-docker-report.json'

      - name: Upload Trivy Docker report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-docker-report
          path: trivy-docker-report.json

      - name: Trivy Docker image security gate
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'juice-shop:ci'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'


  # ------- Scan IaC : Terraform -------
  scan_iac:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Checkov IaC scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform
          soft_fail: true


  # ------- Génération SBOM -------
  generate_sbom:
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - uses: actions/checkout@v4

      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Generate SBOM
        run: syft . -o cyclonedx-json=sbom.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json


  # ------- DAST : analyse dynamique de l'application -------
  dast:
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f .github/Dockerfile.devsecops -t juice-shop:dast .

      - name: Start Juice Shop
        run: docker run -d --name juice-shop -p 3000:3000 juice-shop:dast

      - name: Wait for app
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000 > /dev/null; then
              echo "Juice Shop is ready"
              exit 0
            fi
            echo "Waiting for Juice Shop..."
            sleep 5
          done

          echo "Juice Shop did not become ready"
          docker ps -a
          docker logs juice-shop
          exit 1

      - name: OWASP ZAP Baseline Scan
        run: |
          docker run --rm \
            --user 0 \
            --network host \
            -v "${GITHUB_WORKSPACE}:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://127.0.0.1:3000 \
            -J report_json.json \
            -w report_md.md \
            -r report_html.html \
            -a \
            -I

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: |
            report_html.html
            report_json.json
            report_md.md
          if-no-files-found: warn

      - name: Stop container
        if: always()
        run: |
          docker stop juice-shop || true
          docker rm juice-shop || true
  # ------- Notifications Discord -------
  notify:
    name: Discord Notification
    runs-on: ubuntu-latest

    needs:
      - sast
      - secrets_scan
      - scan_dependencies
      - docker_scan
      - dast

    if: always()

    steps:

      # -------- FAILED --------
      - name: Notify Discord on failure
        if: contains(needs.*.result, 'failure')
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -fsS \
            -H "Content-Type: application/json" \
            -d "{\"content\":\"🚨 **DevSecOps Pipeline FAILED**\n\n📦 Repository: \`${{ github.repository }}\`\n🌿 Branch: \`${{ github.ref_name }}\`\n👤 Author: \`${{ github.actor }}\`\n🔴 Commit: \`${{ github.sha }}\`\n\n❌ A security control has failed.\n\n🔗 <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}>\"}" \
            "$DISCORD_WEBHOOK_URL"

      # -------- SUCCESS --------
      - name: Notify Discord on success
        if: |
          !contains(needs.*.result, 'failure') &&
          !contains(needs.*.result, 'cancelled')
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -fsS \
            -H "Content-Type: application/json" \
            -d "{\"content\":\"✅ **DevSecOps Pipeline PASSED**\n\n📦 Repository: \`${{ github.repository }}\`\n🌿 Branch: \`${{ github.ref_name }}\`\n👤 Author: \`${{ github.actor }}\`\n\n🛡️ All blocking security controls passed.\n\n🔗 <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}>\"}" \
            "$DISCORD_WEBHOOK_URL"

      # -------- CANCELLED --------
      - name: Notify Discord on cancelled
        if: contains(needs.*.result, 'cancelled')
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -fsS \
            -H "Content-Type: application/json" \
            -d "{\"content\":\"⚠️ **DevSecOps Pipeline CANCELLED**\n\n📦 Repository: \`${{ github.repository }}\`\n🌿 Branch: \`${{ github.ref_name }}\`\n👤 Author: \`${{ github.actor }}\`\n\n🔗 <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}>\"}" \
            "$DISCORD_WEBHOOK_URL"

  # ------- Résumé final du pipeline -------
  summary:
    name: DevSecOps Summary
    runs-on: ubuntu-latest

    needs:
      - sast
      - secrets_scan
      - scan_dependencies
      - docker_scan
      - scan_iac
      - generate_sbom
      - dast

    if: always()

    steps:
      - name: Generate pipeline summary
        run: |
          echo "# 🛡️ DevSecOps Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "**Repository :** ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch :** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit :** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Author :** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## 📊 Security Controls" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "| # | Contrôle | Outil | Statut |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|---|" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.sast.result }}" = "success" ]; then
            echo "| 1 | SAST | Semgrep | ✅ success |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 1 | SAST | Semgrep | ❌ ${{ needs.sast.result }} |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.secrets_scan.result }}" = "success" ]; then
            echo "| 2 | Secret Scanning | Gitleaks | ✅ success |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 2 | Secret Scanning | Gitleaks | ❌ ${{ needs.secrets_scan.result }} |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.scan_dependencies.result }}" = "success" ]; then
            echo "| 3 | SCA | Trivy FS | ✅ success |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 3 | SCA | Trivy FS | ❌ ${{ needs.scan_dependencies.result }} |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.docker_scan.result }}" = "success" ]; then
            echo "| 4 | Container Scanning | Trivy | ✅ success |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 4 | Container Scanning | Trivy | ❌ ${{ needs.docker_scan.result }} |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.scan_iac.result }}" = "success" ]; then
            echo "| 5 | IaC Scanning | Checkov | ✅ success |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 5 | IaC Scanning | Checkov | ❌ ${{ needs.scan_iac.result }} |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.generate_sbom.result }}" = "success" ]; then
            echo "| 6 | SBOM | Syft | ✅ success |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 6 | SBOM | Syft | ❌ ${{ needs.generate_sbom.result }} |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.dast.result }}" = "success" ]; then
            echo "| 7 | DAST | OWASP ZAP | ✅ success |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 7 | DAST | OWASP ZAP | ❌ ${{ needs.dast.result }} |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.sast.result }}" != "success" ] || \
             [ "${{ needs.secrets_scan.result }}" != "success" ] || \
             [ "${{ needs.scan_dependencies.result }}" != "success" ] || \
             [ "${{ needs.docker_scan.result }}" != "success" ] || \
             [ "${{ needs.dast.result }}" != "success" ]; then

            echo "## 🚨 Statut global : PIPELINE BLOQUÉ" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Au moins un Security Gate bloquant a échoué." >> $GITHUB_STEP_SUMMARY

          else

            echo "## ✅ Statut global : PIPELINE VALIDÉ" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Tous les contrôles de sécurité bloquants sont validés." >> $GITHUB_STEP_SUMMARY

          fi
