name: DevSecOps Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:

  # ============================================================
  # BUILD
  # ============================================================
  build:
    name: ­ƒÅù´©Å Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install backend dependencies only
        run: npm install --ignore-scripts --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000

      - name: Build backend
        run: npm run build:server


  # ============================================================
  # SAST - SEMGREP
  # ============================================================
  sast:
    name: ­ƒºá SAST - Semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep

    steps:
      - uses: actions/checkout@v4

      - name: Semgrep report
        run: |
          semgrep scan \
            --config=p/owasp-top-ten \
            --json \
            --output=semgrep-report.json
        continue-on-error: true

      - name: Upload Semgrep report
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-report.json

      - name: Semgrep security gate
        run: |
          semgrep scan \
            --config=p/owasp-top-ten \
            --error


  # ============================================================
  # SECRET SCANNING - GITLEAKS
  # ============================================================
  secrets_scan:
    name: ­ƒöæ Secret Scanning - Gitleaks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Gitleaks
        run: |
          curl -sSfL \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar -xz gitleaks

      - name: Gitleaks scan
        run: |
          ./gitleaks detect \
            --no-git \
            --source . \
            --exit-code 1


  # ============================================================
  # SCA - TRIVY FILESYSTEM
  # ============================================================
  scan_dependencies:
    name: ­ƒôª SCA - Trivy FS
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan - report
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          severity: "CRITICAL,HIGH"
          format: "json"
          output: "trivy-fs-report.json"

      - name: Upload Trivy FS report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-report
          path: trivy-fs-report.json

      - name: Trivy filesystem security gate
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          severity: "CRITICAL,HIGH"
          exit-code: "1"


  # ============================================================
  # CONTAINER SCANNING - TRIVY
  # ============================================================
  docker_scan:
    name: ­ƒÉ│ Container Scan - Trivy
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -f .github/Dockerfile.devsecops \
            -t juice-shop:ci .

      - name: Trivy Docker image scan - report
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "juice-shop:ci"
          severity: "CRITICAL,HIGH"
          format: "json"
          output: "trivy-docker-report.json"

      - name: Upload Trivy Docker report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-docker-report
          path: trivy-docker-report.json

      - name: Trivy Docker image security gate
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "juice-shop:ci"
          severity: "CRITICAL,HIGH"
          exit-code: "1"


  # ============================================================
  # IAC - CHECKOV
  # ============================================================
  scan_iac:
    name: ­ƒÅù´©Å IaC Scan - Checkov
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Checkov IaC scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform
          soft_fail: true


  # ============================================================
  # SBOM - SYFT
  # ============================================================
  generate_sbom:
    name: ­ƒôï SBOM - Syft
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - uses: actions/checkout@v4

      - name: Install Syft
        run: |
          curl -sSfL \
            https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Generate SBOM
        run: |
          syft . -o cyclonedx-json=sbom.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json


  # ============================================================
  # DAST - OWASP ZAP
  # ============================================================
  dast:
    name: ­ƒîÉ DAST - OWASP ZAP
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -f .github/Dockerfile.devsecops \
            -t juice-shop:dast .

      - name: Start Juice Shop
        run: |
          docker run -d \
            --name juice-shop \
            -p 3000:3000 \
            juice-shop:dast

      - name: Wait for app
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000 > /dev/null; then
              echo "Juice Shop is ready"
              exit 0
            fi

            echo "Waiting for Juice Shop..."
            sleep 5
          done

          echo "Juice Shop did not become ready"
          docker ps -a
          docker logs juice-shop
          exit 1

      - name: OWASP ZAP Baseline Scan
        run: |
          docker run --rm \
            --user 0 \
            --network host \
            -v "${GITHUB_WORKSPACE}:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://127.0.0.1:3000 \
            -J report_json.json \
            -w report_md.md \
            -r report_html.html \
            -a \
            -I

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: |
            report_html.html
            report_json.json
            report_md.md
          if-no-files-found: warn

      - name: Stop container
        if: always()
        run: |
          docker stop juice-shop || true
          docker rm juice-shop || true


  # ============================================================
  # DISCORD SECURITY NOTIFICATION
  # ============================================================
  notify:
    name: ­ƒôó Discord Security Notification
    runs-on: ubuntu-latest

    needs:
      - build
      - sast
      - secrets_scan
      - scan_dependencies
      - docker_scan
      - dast

    if: always()

    steps:

      - name: Detect pipeline status
        id: status
        shell: bash
        run: |
          FAILED_CONTROLS=""

          if [ "${{ needs.build.result }}" = "failure" ]; then
            FAILED_CONTROLS="${FAILED_CONTROLS}ÔÇó ­ƒÅù´©Å Build ÔÇö Backend Build\n"
          fi

          if [ "${{ needs.sast.result }}" = "failure" ]; then
            FAILED_CONTROLS="${FAILED_CONTROLS}ÔÇó ­ƒºá SAST ÔÇö Semgrep\n"
          fi

          if [ "${{ needs.secrets_scan.result }}" = "failure" ]; then
            FAILED_CONTROLS="${FAILED_CONTROLS}ÔÇó ­ƒöæ Secret Scanning ÔÇö Gitleaks\n"
          fi

          if [ "${{ needs.scan_dependencies.result }}" = "failure" ]; then
            FAILED_CONTROLS="${FAILED_CONTROLS}ÔÇó ­ƒôª SCA ÔÇö Trivy FS\n"
          fi

          if [ "${{ needs.docker_scan.result }}" = "failure" ]; then
            FAILED_CONTROLS="${FAILED_CONTROLS}ÔÇó ­ƒÉ│ Container Scanning ÔÇö Trivy\n"
          fi

          if [ "${{ needs.dast.result }}" = "failure" ]; then
            FAILED_CONTROLS="${FAILED_CONTROLS}ÔÇó ­ƒîÉ DAST ÔÇö OWASP ZAP\n"
          fi

          {
            echo "failed_controls<<EOF"
            printf "%b" "$FAILED_CONTROLS"
            echo
            echo "EOF"
          } >> "$GITHUB_OUTPUT"


      - name: Notify Discord on failure
        if: contains(needs.*.result, 'failure')
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          MESSAGE=$(cat <<EOF
          ­ƒøí´©Å **DEVSECOPS SECURITY ALERT**

          ÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöü

          ­ƒö┤ **PIPELINE BLOCKED**

          A security gate has detected an issue that requires attention.

          ­ƒôª **Repository**
          \`${{ github.repository }}\`

          ­ƒî┐ **Branch**
          \`${{ github.ref_name }}\`

          ­ƒæñ **Triggered by**
          \`${{ github.actor }}\`

          ­ƒöû **Commit**
          \`${{ github.sha }}\`

          ÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöü

          ÔÜá´©Å **Failed Security Controls**

          ${{ steps.status.outputs.failed_controls }}

          ÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöü

          ­ƒöº **Action required**

          Review the failed security control(s) and remediate the detected issue before the pipeline can be validated.

          ­ƒöù **View Pipeline Run**
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          ÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöü
          ­ƒøí´©Å DevSecOps ÔÇó Automated Security Validation
          EOF
          )

          PAYLOAD=$(jq -n --arg content "$MESSAGE" '{content: $content}')

          curl -fsS \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK_URL"


      - name: Notify Discord on success
        if: |
          !contains(needs.*.result, 'failure') &&
          !contains(needs.*.result, 'cancelled') &&
          !contains(needs.*.result, 'skipped')
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          MESSAGE=$(cat <<EOF
          ­ƒøí´©Å **DEVSECOPS SECURITY REPORT**

          ÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöü

          ­ƒƒó **PIPELINE VALIDATED**

          All blocking security controls have passed successfully.

          ­ƒôª **Repository**
          \`${{ github.repository }}\`

          ­ƒî┐ **Branch**
          \`${{ github.ref_name }}\`

          ­ƒæñ **Triggered by**
          \`${{ github.actor }}\`

          ­ƒöû **Commit**
          \`${{ github.sha }}\`

          ÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöü

          Ô£à **Security Validation**

          ÔÇó ­ƒºá SAST ÔÇö Semgrep
          ÔÇó ­ƒöæ Secret Scanning ÔÇö Gitleaks
          ÔÇó ­ƒôª SCA ÔÇö Trivy FS
          ÔÇó ­ƒÉ│ Container Scanning ÔÇö Trivy
          ÔÇó ­ƒîÉ DAST ÔÇö OWASP ZAP

          ­ƒôï SBOM ÔÇö Syft generated
          ­ƒÅù´©Å IaC ÔÇö Checkov audited

          ÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöü

          ­ƒöù **View Pipeline Run**
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          ÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöü
          ­ƒøí´©Å DevSecOps ÔÇó Automated Security Validation
          EOF
          )

          PAYLOAD=$(jq -n --arg content "$MESSAGE" '{content: $content}')

          curl -fsS \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK_URL"


      - name: Notify Discord on cancelled
        if: contains(needs.*.result, 'cancelled')
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          MESSAGE=$(cat <<EOF
          ÔÜá´©Å **DEVSECOPS PIPELINE CANCELLED**

          ÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöü

          ­ƒƒí **SECURITY VALIDATION INTERRUPTED**

          The workflow was cancelled before all security controls completed.

          ­ƒôª **Repository**
          \`${{ github.repository }}\`

          ­ƒî┐ **Branch**
          \`${{ github.ref_name }}\`

          ­ƒæñ **Triggered by**
          \`${{ github.actor }}\`

          ­ƒöû **Commit**
          \`${{ github.sha }}\`

          ÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöü

          ­ƒöù **View Pipeline Run**
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          ÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöüÔöü
          ­ƒøí´©Å DevSecOps ÔÇó Automated Security Validation
          EOF
          )

          PAYLOAD=$(jq -n --arg content "$MESSAGE" '{content: $content}')

          curl -fsS \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK_URL"


  # ============================================================
  # SECURITY CONTROL ROOM - GITHUB SUMMARY
  # ============================================================
  summary:
    name: ­ƒøí´©Å Security Control Room
    runs-on: ubuntu-latest

    needs:
      - build
      - sast
      - secrets_scan
      - scan_dependencies
      - docker_scan
      - scan_iac
      - generate_sbom
      - dast

    if: always()

    steps:
      - name: Generate Security Control Room
        shell: bash
        run: |

          echo "# ­ƒøí´©Å DEVSECOPS SECURITY CONTROL ROOM" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "> **Continuous Security Validation Dashboard**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "## ­ƒôª Application Context" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "| Property | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Repository | \`${{ github.repository }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Triggered by | \`${{ github.actor }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "## ­ƒöì Security Pipeline" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          echo "SOURCE CODE" >> "$GITHUB_STEP_SUMMARY"
          echo "     Ôöé" >> "$GITHUB_STEP_SUMMARY"
          echo "     Ôû╝" >> "$GITHUB_STEP_SUMMARY"
          echo "­ƒºá SAST - Semgrep" >> "$GITHUB_STEP_SUMMARY"
          echo "     Ôöé" >> "$GITHUB_STEP_SUMMARY"
          echo "     Ôû╝" >> "$GITHUB_STEP_SUMMARY"
          echo "­ƒöæ Secrets - Gitleaks" >> "$GITHUB_STEP_SUMMARY"
          echo "     Ôöé" >> "$GITHUB_STEP_SUMMARY"
          echo "     Ôû╝" >> "$GITHUB_STEP_SUMMARY"
          echo "­ƒôª SCA - Trivy FS" >> "$GITHUB_STEP_SUMMARY"
          echo "     Ôöé" >> "$GITHUB_STEP_SUMMARY"
          echo "     Ôû╝" >> "$GITHUB_STEP_SUMMARY"
          echo "­ƒÉ│ Container - Trivy" >> "$GITHUB_STEP_SUMMARY"
          echo "     Ôöé" >> "$GITHUB_STEP_SUMMARY"
          echo "     Ôû╝" >> "$GITHUB_STEP_SUMMARY"
          echo "­ƒÅù´©Å IaC - Checkov" >> "$GITHUB_STEP_SUMMARY"
          echo "     Ôöé" >> "$GITHUB_STEP_SUMMARY"
          echo "     Ôû╝" >> "$GITHUB_STEP_SUMMARY"
          echo "­ƒôï SBOM - Syft" >> "$GITHUB_STEP_SUMMARY"
          echo "     Ôöé" >> "$GITHUB_STEP_SUMMARY"
          echo "     Ôû╝" >> "$GITHUB_STEP_SUMMARY"
          echo "­ƒîÉ DAST - OWASP ZAP" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "## ­ƒÜª Security Control Status" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "| Security Layer | Tool | Type | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ needs.build.result }}" = "success" ]; then
            echo "| ­ƒÅù´©Å Build | Node.js | Blocking | ­ƒƒó PASSED |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| ­ƒÅù´©Å Build | Node.js | Blocking | ­ƒö┤ ${{ needs.build.result }} |" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${{ needs.sast.result }}" = "success" ]; then
            echo "| ­ƒºá SAST | Semgrep | Blocking | ­ƒƒó PASSED |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| ­ƒºá SAST | Semgrep | Blocking | ­ƒö┤ ${{ needs.sast.result }} |" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${{ needs.secrets_scan.result }}" = "success" ]; then
            echo "| ­ƒöæ Secrets | Gitleaks | Blocking | ­ƒƒó PASSED |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| ­ƒöæ Secrets | Gitleaks | Blocking | ­ƒö┤ ${{ needs.secrets_scan.result }} |" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${{ needs.scan_dependencies.result }}" = "success" ]; then
            echo "| ­ƒôª SCA | Trivy FS | Blocking | ­ƒƒó PASSED |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| ­ƒôª SCA | Trivy FS | Blocking | ­ƒö┤ ${{ needs.scan_dependencies.result }} |" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${{ needs.docker_scan.result }}" = "success" ]; then
            echo "| ­ƒÉ│ Container | Trivy | Blocking | ­ƒƒó PASSED |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| ­ƒÉ│ Container | Trivy | Blocking | ­ƒö┤ ${{ needs.docker_scan.result }} |" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${{ needs.scan_iac.result }}" = "success" ]; then
            echo "| ­ƒÅù´©Å IaC | Checkov | Audit | ­ƒƒí REVIEWED |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| ­ƒÅù´©Å IaC | Checkov | Audit | ­ƒö┤ ${{ needs.scan_iac.result }} |" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${{ needs.generate_sbom.result }}" = "success" ]; then
            echo "| ­ƒôï SBOM | Syft | Inventory | ­ƒƒó GENERATED |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| ­ƒôï SBOM | Syft | Inventory | ­ƒö┤ ${{ needs.generate_sbom.result }} |" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${{ needs.dast.result }}" = "success" ]; then
            echo "| ­ƒîÉ DAST | OWASP ZAP | Blocking | ­ƒƒó PASSED |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| ­ƒîÉ DAST | OWASP ZAP | Blocking | ­ƒö┤ ${{ needs.dast.result }} |" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "## ­ƒÜª Security Gates" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "| Gate | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ needs.sast.result }}" = "success" ]; then
            echo "| ­ƒºá SAST | ­ƒƒó OPEN |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| ­ƒºá SAST | ­ƒö┤ BLOCKED |" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${{ needs.secrets_scan.result }}" = "success" ]; then
            echo "| ­ƒöæ Secrets | ­ƒƒó OPEN |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| ­ƒöæ Secrets | ­ƒö┤ BLOCKED |" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${{ needs.scan_dependencies.result }}" = "success" ]; then
            echo "| ­ƒôª SCA | ­ƒƒó OPEN |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| ­ƒôª SCA | ­ƒö┤ BLOCKED |" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${{ needs.docker_scan.result }}" = "success" ]; then
            echo "| ­ƒÉ│ Container | ­ƒƒó OPEN |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| ­ƒÉ│ Container | ­ƒö┤ BLOCKED |" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${{ needs.dast.result }}" = "success" ]; then
            echo "| ­ƒîÉ DAST | ­ƒƒó OPEN |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| ­ƒîÉ DAST | ­ƒö┤ BLOCKED |" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ needs.build.result }}" = "success" ] && \
             [ "${{ needs.sast.result }}" = "success" ] && \
             [ "${{ needs.secrets_scan.result }}" = "success" ] && \
             [ "${{ needs.scan_dependencies.result }}" = "success" ] && \
             [ "${{ needs.docker_scan.result }}" = "success" ] && \
             [ "${{ needs.dast.result }}" = "success" ]; then

            echo "## ­ƒƒó FINAL DECISION" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### ­ƒøí´©Å PIPELINE VALIDATED" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "All blocking security gates have passed successfully." >> "$GITHUB_STEP_SUMMARY"

          else

            echo "## ­ƒö┤ FINAL DECISION" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### ­ƒÜ¿ PIPELINE BLOCKED" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "At least one blocking security gate requires attention before validation." >> "$GITHUB_STEP_SUMMARY"

          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "---" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "­ƒôÄ **Security reports and SBOM are available in the workflow artifacts.**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "­ƒôó **Discord notification:** enabled" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "­ƒøí´©Å *DevSecOps ÔÇó Automated Security Validation*" >> "$GITHUB_STEP_SUMMARY"


   # ============================================================
  # CYBER SECURITY CONTROL ROOM - HTML DASHBOARD
  # ============================================================
  dashboard:
    name: ­ƒøí´©Å Cyber Security Control Room
    runs-on: ubuntu-latest

    needs:
      - build
      - sast
      - secrets_scan
      - scan_dependencies
      - docker_scan
      - scan_iac
      - generate_sbom
      - dast

    if: always()

    steps:

      # ========================================================
      # DOWNLOAD SECURITY ARTIFACTS
      # ========================================================
      - name: Download security artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: "*-report"
          path: reports
          merge-multiple: false

      - name: Download SBOM
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: sbom
          path: reports/sbom


      # ========================================================
      # GENERATE CYBER SECURITY DASHBOARD
      # ========================================================
      - name: Generate Cyber Security Dashboard
        shell: bash
        run: |

          mkdir -p security-dashboard/reports

          # ----------------------------------------------------
          # PIPELINE STATUS
          # ----------------------------------------------------

          BUILD_STATUS="${{ needs.build.result }}"
          SAST_STATUS="${{ needs.sast.result }}"
          SECRETS_STATUS="${{ needs.secrets_scan.result }}"
          SCA_STATUS="${{ needs.scan_dependencies.result }}"
          DOCKER_STATUS="${{ needs.docker_scan.result }}"
          IAC_STATUS="${{ needs.scan_iac.result }}"
          SBOM_STATUS="${{ needs.generate_sbom.result }}"
          DAST_STATUS="${{ needs.dast.result }}"

          BLOCKING_FAILURES=0

          for STATUS in \
            "$BUILD_STATUS" \
            "$SAST_STATUS" \
            "$SECRETS_STATUS" \
            "$SCA_STATUS" \
            "$DOCKER_STATUS" \
            "$DAST_STATUS"
          do
            if [ "$STATUS" != "success" ]; then
              BLOCKING_FAILURES=$((BLOCKING_FAILURES + 1))
            fi
          done


          # ----------------------------------------------------
          # FINAL STATUS
          # ----------------------------------------------------

          if [ "$BLOCKING_FAILURES" -eq 0 ]; then
            FINAL_STATUS="SECURE"
            FINAL_CLASS="secure"
            FINAL_ICON="­ƒƒó"
            SECURITY_SCORE="100"
          else
            FINAL_STATUS="BLOCKED"
            FINAL_CLASS="blocked"
            FINAL_ICON="­ƒö┤"

            SECURITY_SCORE=$((100 - BLOCKING_FAILURES * 15))

            if [ "$SECURITY_SCORE" -lt 0 ]; then
              SECURITY_SCORE=0
            fi
          fi


          # ----------------------------------------------------
          # STATUS FUNCTIONS
          # ----------------------------------------------------

          status_class() {

            case "$1" in
              success)
                echo "passed"
                ;;
              skipped)
                echo "warning"
                ;;
              *)
                echo "blocked"
                ;;
            esac

          }


          status_icon() {

            case "$1" in
              success)
                echo "­ƒƒó"
                ;;
              skipped)
                echo "­ƒƒí"
                ;;
              *)
                echo "­ƒö┤"
                ;;
            esac

          }


          # ----------------------------------------------------
          # COLLECT REPORTS
          # ----------------------------------------------------

          find reports -type f -exec cp {} security-dashboard/reports/ \; 2>/dev/null || true


          # ----------------------------------------------------
          # CREATE REPORT INDEX
          # ----------------------------------------------------

          REPORT_LINKS=""

          if [ -f "security-dashboard/reports/semgrep-report.json" ]; then
            REPORT_LINKS="${REPORT_LINKS}
              <a class=\"report-link\" href=\"reports/semgrep-report.json\" target=\"_blank\">
                ­ƒºá Semgrep JSON
              </a>"
          fi

          if [ -f "security-dashboard/reports/trivy-fs-report.json" ]; then
            REPORT_LINKS="${REPORT_LINKS}
              <a class=\"report-link\" href=\"reports/trivy-fs-report.json\" target=\"_blank\">
                ­ƒôª Trivy Filesystem JSON
              </a>"
          fi

          if [ -f "security-dashboard/reports/trivy-docker-report.json" ]; then
            REPORT_LINKS="${REPORT_LINKS}
              <a class=\"report-link\" href=\"reports/trivy-docker-report.json\" target=\"_blank\">
                ­ƒÉ│ Trivy Container JSON
              </a>"
          fi

          if [ -f "security-dashboard/reports/report_html.html" ]; then
            REPORT_LINKS="${REPORT_LINKS}
              <a class=\"report-link highlight\" href=\"reports/report_html.html\" target=\"_blank\">
                ­ƒîÉ OWASP ZAP HTML Report
              </a>"
          fi

          if [ -f "security-dashboard/reports/report_json.json" ]; then
            REPORT_LINKS="${REPORT_LINKS}
              <a class=\"report-link\" href=\"reports/report_json.json\" target=\"_blank\">
                ­ƒîÉ OWASP ZAP JSON
              </a>"
          fi

          if [ -f "security-dashboard/reports/report_md.md" ]; then
            REPORT_LINKS="${REPORT_LINKS}
              <a class=\"report-link\" href=\"reports/report_md.md\" target=\"_blank\">
                ­ƒôØ OWASP ZAP Markdown
              </a>"
          fi

          if [ -f "security-dashboard/reports/sbom.json" ]; then
            REPORT_LINKS="${REPORT_LINKS}
              <a class=\"report-link\" href=\"reports/sbom.json\" target=\"_blank\">
                ­ƒôï SBOM ÔÇö CycloneDX
              </a>"
          fi


          # ----------------------------------------------------
          # HTML DASHBOARD
          # ----------------------------------------------------

          cat > security-dashboard/security-dashboard.html <<EOF

